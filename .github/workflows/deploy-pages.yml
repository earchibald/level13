name: Deploy to GitHub Pages (mobile)

# Publishes the mobile port to https://earchibald.github.io/level13-mobile
#
# How this works: this workflow travels with the gh-pages-mobile branch.
# The branch is pushed to TWO repositories:
#   - earchibald/level13 (source of truth; the workflow is skipped there
#     so it can never overwrite the desktop site at /level13)
#   - earchibald/level13-mobile (hosting repo; the workflow runs there and
#     deploys this branch to that repo's GitHub Pages)
#
# To publish an update:
#   git push origin gh-pages-mobile
#   git push mobile  gh-pages-mobile
# where "mobile" is the earchibald/level13-mobile remote.
#
# No secrets or deploy keys are needed: the deploy runs inside
# level13-mobile with its own GITHUB_TOKEN.

on:
  push:
    branches:
      - gh-pages-mobile
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, without cancelling in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Guard: only the hosting repo deploys. In earchibald/level13 this job
    # is skipped, so the desktop site at /level13 is never touched.
    if: github.repository == 'earchibald/level13-mobile'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # First deploy enables GitHub Pages on the repo automatically.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The game is a static site served from the repository root.
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
