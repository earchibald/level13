name: Deploy to GitHub Pages

# Publishes both distributions:
#   gh-pages        in earchibald/level13        -> earchibald.github.io/level13         (RELEASE)
#   gh-pages-mobile in earchibald/level13-mobile -> earchibald.github.io/level13-mobile  (CANDIDATE)
#
# One file, identical on both branches. That is deliberate: the branches are
# kept byte-identical so promoting the candidate is a fast-forward, and a
# workflow that differed per branch would conflict on every promotion.
#
# The pairing below is what keeps them apart. gh-pages-mobile is also pushed
# to earchibald/level13 as the source of truth, and there it must NOT deploy -
# otherwise the candidate would overwrite the release site at /level13.
#
# To publish:
#   git push origin gh-pages          # release
#   git push origin gh-pages-mobile   # source of truth, deploys nothing
#   git push mobile gh-pages-mobile   # candidate
#
# No secrets or deploy keys: each deploy runs in its own repo with GITHUB_TOKEN.

on:
  push:
    branches:
      - gh-pages
      - gh-pages-mobile
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, without cancelling in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Each branch deploys from exactly one repository. Every other combination
    # is skipped, which is how gh-pages-mobile stays harmless in earchibald/level13.
    if: >-
      (github.repository == 'earchibald/level13' && github.ref_name == 'gh-pages') ||
      (github.repository == 'earchibald/level13-mobile' && github.ref_name == 'gh-pages-mobile')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # First deploy enables GitHub Pages on the repo automatically.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The game is a static site served from the repository root.
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
