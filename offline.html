<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Level 13 - offline</title>
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<meta name="theme-color" content="#202220">
	<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
	<link rel="icon" type="image/svg+xml" href="favicon.svg" />
	<style>
		html, body {
			margin: 0;
			height: 100%;
			background: #202220;
			color: #cccccc;
			font-family: Arial, Helvetica, sans-serif;
		}

		main {
			height: 100%;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			text-align: center;
			padding: 0 2em;
			box-sizing: border-box;
		}

		h1 {
			font-family: "Arial Narrow", Arial, sans-serif;
			text-transform: uppercase;
			letter-spacing: 0.05em;
			font-size: 1.4em;
			margin: 0 0 0.6em 0;
		}

		p {
			margin: 0 0 1.4em 0;
			max-width: 24em;
			line-height: 1.45;
		}

		button {
			font: inherit;
			text-transform: lowercase;
			padding: 10px 22px;
			min-height: 44px;
			color: #cccccc;
			background: #282a28;
			border: 1px solid #3a3a3a;
		}
	</style>
</head>
<body>
	<main>
		<h1>No signal</h1>
		<p>Level 13 could not reach the network, and this part of the game has not been stored on this device yet. Your save is untouched.</p>
		<button onclick="location.reload()">try again</button>
	</main>
</body>
</html>
